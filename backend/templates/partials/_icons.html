{# Iconos SVG de la app (trazo 2 px, 24×24, currentColor) — reemplazan los
   emojis de topbar / pestañas / tarjetas, que se veían distintos en cada
   Windows y Mac. Un sprite por página (`{{ sprite() }}` en base.html) y
   `{{ icon("bell") }}` donde haga falta: <svg class="ico"><use href="#i-bell"/>.
   Nombres: home bell search user plug logout dollar chart-bar chart-line
   ruler save scale database more copy download refresh warning info check x
   clock table pie settings keyboard. #}
{%- macro icon(name, size=16, cls="") -%}
<svg class="ico{% if cls %} {{ cls }}{% endif %}" width="{{ size }}" height="{{ size }}" aria-hidden="true" focusable="false"><use href="#i-{{ name }}"/></svg>
{%- endmacro -%}
