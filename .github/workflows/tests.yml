# CI del repo: suite completa + lint en cada PR y cada push a main.
# Corre en GitHub (no toca la app ni sus tiempos). Sin red a BCRA/broker:
# los servicios caen a sus backups/fixtures, igual que en los tests locales.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Ubuntu + Windows: la app se despliega también como servicio Windows y el
    # add-in de Excel corre ahí; un job sólo-Linux no vio que os.fchmod no
    # existe en Windows (ningún guardado de usuarios funcionaba en ese server).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements.txt
      - name: Lint (ruff F/E9)
        if: runner.os == 'Linux'
        run: python -m ruff check backend/ --select F,E9
      # --timeout: un test colgado falla a los 5 min CON su stack (pytest-timeout)
      # en vez de comerse los 25 min del job en silencio.
      - name: Suite de tests
        run: python -m pytest -q --timeout=300
